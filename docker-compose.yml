services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_academy_db}
      POSTGRES_USER: ${POSTGRES_USER:-smart_academy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_academy_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-smart_academy_user}:${POSTGRES_PASSWORD:-smart_academy_dev_password}@db:5432/${POSTGRES_DB:-smart_academy_db}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    command: sh -c "python manage.py migrate --settings=config.settings.production && gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 3 --timeout 180"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose: ["8001"]
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  media_data:
