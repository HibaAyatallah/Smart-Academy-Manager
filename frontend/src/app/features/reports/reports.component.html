<app-page-header title="Rapports et exports" subtitle="Indicateurs consolidés et exports opérationnels."><button mat-stroked-button (click)="export('csv')" [disabled]="!!exporting"><mat-icon>table_view</mat-icon>CSV</button><button mat-flat-button color="primary" (click)="export('pdf')" [disabled]="!!exporting"><mat-icon>picture_as_pdf</mat-icon>PDF</button></app-page-header>
<form [formGroup]="filters" class="filters" (ngSubmit)="load()"><mat-form-field appearance="outline"><mat-label>Du</mat-label><input matInput type="date" formControlName="date_from"></mat-form-field><mat-form-field appearance="outline"><mat-label>Au</mat-label><input matInput type="date" formControlName="date_to"></mat-form-field><mat-form-field appearance="outline"><mat-label>ID Business Unit</mat-label><input matInput type="number" formControlName="business_unit"></mat-form-field><button mat-flat-button color="primary">Actualiser</button></form>
<div class="state" *ngIf="loading"><mat-spinner diameter="40"/><span>Calcul des indicateurs…</span></div><app-empty-state *ngIf="!loading&&error" icon="query_stats" title="Rapport indisponible" [message]="error"><button mat-button (click)="load()">Réessayer</button></app-empty-state>
<ng-container *ngIf="!loading&&data"><div class="cards"><mat-card *ngFor="let item of entries(data.cards)"><mat-card-content><small>{{label(item[0])}}</small><strong>{{item[1]|number}}</strong></mat-card-content></mat-card></div><h2>Indicateurs de performance</h2><div class="kpis"><mat-card *ngFor="let item of entries(data.kpis)"><mat-card-content><span>{{label(item[0])}}</span><strong>{{item[1]|number:'1.0-1'}}</strong></mat-card-content></mat-card></div><h2>Activité récente</h2><div class="activity" *ngFor="let activity of data.recent_activities"><strong>{{activity.action}}</strong><span>{{activity.actor_name}}</span></div></ng-container>
