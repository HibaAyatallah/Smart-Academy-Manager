<app-page-header title="Centre de notifications" subtitle="Suivez vos alertes et choisissez les événements à recevoir."><button mat-stroked-button (click)="readAll()"><mat-icon>done_all</mat-icon>Tout marquer comme lu</button></app-page-header>
<div class="state" *ngIf="loading"><mat-spinner diameter="36"/><span>Chargement…</span></div>
<app-empty-state *ngIf="!loading&&error" icon="error_outline" title="Chargement impossible" [message]="error"><button mat-flat-button (click)="load()">Réessayer</button></app-empty-state>
<div class="grid" *ngIf="!loading&&!error">
  <section><mat-card *ngFor="let item of notifications" class="notification" [class.unread]="!item.is_read" (click)="read(item)"><mat-card-content><div class="icon"><mat-icon>{{item.category==='DOCUMENT'?'description':item.category==='CERTIFICATE'?'card_membership':'notifications'}}</mat-icon></div><div><h3>{{item.title}}</h3><p>{{item.message}}</p><small>{{item.created_at|date:'medium'}}</small><a *ngIf="item.link" [routerLink]="item.link" (click)="read(item)">Ouvrir</a></div></mat-card-content></mat-card><app-empty-state *ngIf="notifications.length===0" icon="notifications_none" title="Aucune notification" description="Vous êtes à jour."/></section>
  <mat-card class="preferences" *ngIf="preferences"><mat-card-header><mat-card-title>Préférences</mat-card-title></mat-card-header><mat-card-content><mat-checkbox *ngFor="let field of preferenceFields" [(ngModel)]="preferences[field.key]">{{field.label}}</mat-checkbox><button mat-flat-button color="primary" (click)="savePreferences()" [disabled]="saving">{{saving?'Enregistrement…':'Enregistrer'}}</button></mat-card-content></mat-card>
</div>
