<app-page-header title="Notifications" subtitle="Activité, statut de lecture et préférences"></app-page-header><div class="toolbar"><mat-checkbox [(ngModel)]="unreadOnly" (change)="load()">Non lues uniquement</mat-checkbox><select [(ngModel)]="category" (change)="load()"><option value="">Toutes les catégories</option><option *ngFor="let value of categories" [value]="value">{{value}}</option></select><button mat-stroked-button (click)="markAll()">Tout marquer comme lu</button></div><p *ngIf="loading">Chargement…</p><p *ngIf="!loading&&!items.length">Aucune notification.</p><mat-card *ngFor="let item of items" [class.unread]="!item.is_read" (click)="open(item)"><strong>{{item.title}}</strong><span>{{item.message}}</span><small>{{item.category}} · {{item.created_at|date:'dd/MM/yyyy HH:mm'}}</small></mat-card><section><h2>Préférences</h2><mat-checkbox [(ngModel)]="preferences.approvals">Approbations</mat-checkbox><mat-checkbox [(ngModel)]="preferences.assignments">Affectations</mat-checkbox><mat-checkbox [(ngModel)]="preferences.sessions">Sessions</mat-checkbox><mat-checkbox [(ngModel)]="preferences.evaluations">Évaluations</mat-checkbox><mat-checkbox [(ngModel)]="preferences.documents">Documents</mat-checkbox><mat-checkbox [(ngModel)]="preferences.certificates">Certificats</mat-checkbox><button mat-flat-button color="primary" (click)="savePreferences()">Enregistrer</button></section>
