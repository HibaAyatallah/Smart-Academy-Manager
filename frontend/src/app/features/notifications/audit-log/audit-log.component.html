<app-page-header title="Journal d'audit" subtitle="Traçabilité sécurisée des modifications"></app-page-header><div class="filters"><mat-form-field appearance="outline"><mat-label>Recherche</mat-label><input matInput [(ngModel)]="search"></mat-form-field><select [(ngModel)]="method"><option value="">Toutes les actions</option><option>POST</option><option>PATCH</option><option>PUT</option><option>DELETE</option></select><button mat-stroked-button (click)="load()">Filtrer</button></div><p *ngIf="loading">Chargement…</p><p *ngIf="!loading&&!items.length">Aucune entrée.</p><mat-card *ngFor="let item of items"><div><strong>{{item.method}} {{item.path}}</strong><span>{{item.actor_email||'Système'}} · HTTP {{item.status_code}}</span></div><small>{{item.created_at|date:'dd/MM/yyyy HH:mm:ss'}} · {{item.ip_address||'IP inconnue'}}</small></mat-card>
