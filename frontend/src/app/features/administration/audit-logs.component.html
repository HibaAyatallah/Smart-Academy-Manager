<app-page-header title="Journaux d’audit" subtitle="Traçabilité des opérations sensibles de la plateforme."/>
<form [formGroup]="filters" class="filters" (ngSubmit)="load()"><mat-form-field appearance="outline"><mat-label>Recherche</mat-label><input matInput formControlName="search"></mat-form-field><mat-form-field appearance="outline"><mat-label>Méthode</mat-label><mat-select formControlName="method"><mat-option value="">Toutes</mat-option><mat-option *ngFor="let method of ['POST','PATCH','PUT','DELETE']" [value]="method">{{method}}</mat-option></mat-select></mat-form-field><mat-form-field appearance="outline"><mat-label>Statut HTTP</mat-label><input matInput type="number" formControlName="status_code"></mat-form-field><button mat-flat-button color="primary">Filtrer</button></form>
<app-empty-state *ngIf="error" icon="error_outline" title="Chargement impossible" [message]="error"><button mat-button (click)="load()">Réessayer</button></app-empty-state>
<div class="table-wrap" *ngIf="!error"><table mat-table [dataSource]="rows"><ng-container matColumnDef="created_at"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let row">{{row.created_at|date:'short'}}</td></ng-container><ng-container matColumnDef="actor_email"><th mat-header-cell *matHeaderCellDef>Acteur</th><td mat-cell *matCellDef="let row">{{row.actor_email||'Système'}}</td></ng-container><ng-container matColumnDef="method"><th mat-header-cell *matHeaderCellDef>Méthode</th><td mat-cell *matCellDef="let row"><code>{{row.method}}</code></td></ng-container><ng-container matColumnDef="path"><th mat-header-cell *matHeaderCellDef>Ressource</th><td mat-cell *matCellDef="let row">{{row.path}}</td></ng-container><ng-container matColumnDef="status_code"><th mat-header-cell *matHeaderCellDef>Statut</th><td mat-cell *matCellDef="let row">{{row.status_code}}</td></ng-container><tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row;columns:columns"></tr></table><mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="20" (page)="page($event)"/></div>
