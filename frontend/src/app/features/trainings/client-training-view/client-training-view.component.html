<app-page-header title="Mes formations client" subtitle="Sessions et ressources réservées à votre organisation"></app-page-header><p *ngIf="loading">Chargement…</p><p class="error" *ngIf="error">{{error}}</p><p *ngIf="!loading&&!trainings.length">Aucune formation client n'est actuellement affectée.</p><div class="grid"><mat-card *ngFor="let training of trainings"><mat-card-title>{{training.title}}</mat-card-title><mat-card-subtitle>{{training.project_name}}</mat-card-subtitle><div class="links"><a *ngIf="safe(training.associated_link)" mat-stroked-button [href]="safe(training.associated_link)" target="_blank" rel="noopener">Ressource</a><a *ngIf="safe(training.moodle_link)" mat-flat-button color="primary" [href]="safe(training.moodle_link)" target="_blank" rel="noopener">Moodle</a></div><h3>Sessions</h3><div *ngFor="let session of training.sessions" class="session"><span>{{session.start_date|date:'dd/MM/yyyy'}} · {{session.start_time}}</span><mat-chip>{{labels[session.status]||session.status}}</mat-chip><a *ngIf="safe(session.online_link)" [href]="safe(session.online_link)" target="_blank" rel="noopener">Rejoindre</a></div></mat-card></div>
