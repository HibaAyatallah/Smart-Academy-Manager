<app-page-header title="Collaborateurs par Business Unit" subtitle="Consultation RH en lecture seule"></app-page-header><p *ngIf="loading">Chargement…</p><p class="error" *ngIf="error">{{error}}</p><mat-card *ngFor="let group of groups"><mat-card-title>{{group.bu_name}}</mat-card-title><mat-card-subtitle>{{group.bu_code}} · Manager : {{group.manager_name||'Non affecté'}}</mat-card-subtitle><div class="member" *ngFor="let member of group.members"><div><strong>{{member.full_name||member.email}}</strong><small>{{member.email}}</small></div><div><span>{{member.position||'Poste non renseigné'}}</span><small>Depuis le {{member.joined_at|date:'dd/MM/yyyy'}}</small></div></div></mat-card>
