<app-page-header title="Membres de ma Business Unit" subtitle="Consultez les collaborateurs actifs de votre équipe" />

<div *ngIf="isLoading"><mat-spinner diameter="36" /></div>
<p *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>

<mat-card *ngIf="!isLoading && !errorMessage">
  <p *ngIf="!members.length">Aucun collaborateur actif.</p>
  <table mat-table [dataSource]="members" *ngIf="members.length">
    <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Collaborateur</th><td mat-cell *matCellDef="let member">{{ member.user_name }}</td></ng-container>
    <ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef>Email</th><td mat-cell *matCellDef="let member">{{ member.user_email }}</td></ng-container>
    <ng-container matColumnDef="position"><th mat-header-cell *matHeaderCellDef>Poste</th><td mat-cell *matCellDef="let member">{{ member.position || 'Non renseigné' }}</td></ng-container>
    <ng-container matColumnDef="joined_at"><th mat-header-cell *matHeaderCellDef>Depuis le</th><td mat-cell *matCellDef="let member">{{ member.joined_at | date:'dd/MM/yyyy' }}</td></ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
