<div class="auth-page"><section class="auth-card">
  <header><mat-icon>lock_reset</mat-icon><h1>Mot de passe oublié</h1><p>Saisissez l’adresse email associée à votre compte.</p></header>

  <div *ngIf="submitted" class="notice success" role="status"><mat-icon>mark_email_read</mat-icon><span>{{ neutralMessage }}</span></div>

  <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Adresse email</mat-label>
      <mat-icon matPrefix>email</mat-icon>
      <input matInput type="email" autocomplete="email" formControlName="email">
      <mat-error *ngIf="form.controls.email.hasError('required')">Ce champ est obligatoire.</mat-error>
      <mat-error *ngIf="form.controls.email.hasError('email')">Saisissez une adresse email valide.</mat-error>
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
      <mat-icon>{{ submitting ? 'hourglass_empty' : 'send' }}</mat-icon>
      {{ submitting ? 'Envoi en cours...' : 'Envoyer le lien de réinitialisation' }}
    </button>
  </form>
  <a mat-button routerLink="/connexion"><mat-icon>arrow_back</mat-icon>Retour à la connexion</a>
</section></div>
